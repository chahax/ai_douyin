<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#eaf0f5;font:13px/1.65 system-ui,"Microsoft YaHei",sans-serif}
.shell{border:1px solid #303741;border-radius:16px;overflow:hidden;background:#15191f}.head{padding:18px 22px 12px;display:flex;justify-content:space-between;gap:16px}.head h2{font-size:16px;margin:0;font-weight:600}.head p{color:#9ca9b8;font-size:12px;margin:4px 0 0}.hint{font-size:11px;color:#89c9da;white-space:nowrap}
.canvas{max-height:430px;overflow:auto;background:radial-gradient(circle,#303b47 1px,transparent 1px);background-size:20px 20px;padding:8px 16px 14px;scrollbar-color:#44566b #191f28}
svg{height:auto;display:block;min-width:650px;width:100%;max-width:1000px;margin:auto;max-height:410px}svg text{pointer-events:none;font-family:inherit}.node{cursor:pointer;outline:none}.node rect{fill:#1a242e;stroke:#426078;stroke-width:1.3;transition:stroke .15s,fill .15s}.node:hover rect,.node:focus rect{stroke:#79ddeb;stroke-width:2;fill:#223441}.node.selected rect{stroke:#bcf56b;stroke-width:2;fill:#26332b}.node .label{fill:#edf4f7;font-size:14px;font-weight:600}.node .sub{fill:#a7b7c4;font-size:10px}.node .dot{fill:#7ed8e6}.node.disabled rect{stroke:#65534c;stroke-dasharray:5 4;fill:#262222}.node.disabled .dot{fill:#c9a185}.edge{cursor:pointer;outline:none}.edge .wire{fill:none;stroke:#63899e;stroke-width:1.5}.edge .hit{fill:none;stroke:transparent;stroke-width:32}.edge.pending .wire{stroke-dasharray:6 5;stroke:#817264}.edge.selected .wire,.edge:hover .wire,.edge:focus .wire{stroke:#bcf56b;stroke-width:3}.edge.selected .edge-label,.edge:focus .edge-label{pointer-events:all;cursor:pointer;fill:#bcf56b}.edge-label{pointer-events:all;cursor:pointer;fill:#a5bdca;font-size:10px;paint-order:stroke;stroke:#15191f;stroke-width:5;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:9px 22px;color:#94a2b3;font-size:11px;border-top:1px solid #29313c}.legend b{color:#7ed8e6;font-weight:400}.detail{padding:17px 22px 20px;border-top:1px solid #303741;background:#1a2028}.detail-top{display:flex;justify-content:space-between;gap:15px;align-items:center}.detail h3{margin:0;color:#ecf4f7;font-size:16px}.badge{color:#cce7a9;background:#303e2b;border-radius:20px;padding:3px 10px;font-size:11px}.detail p{color:#b6c4d1;font-size:12px;line-height:1.9;margin:10px 0;white-space:pre-wrap}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px;margin:0}.facts div{border-top:1px solid #333d49;padding-top:8px;overflow-wrap:anywhere}.facts dt{color:#91a0af;font-size:11px}.facts dd{margin:2px 0;color:#d3e1e9;font-size:12px;white-space:pre-wrap}button{font:inherit;background:#24323d;border:1px solid #496273;color:#d2e8f2;border-radius:7px;padding:4px 10px;cursor:pointer}button:focus-visible{outline:2px solid #bcf56b;outline-offset:3px}.empty{padding:25px;color:#a8b4c0}
@media(max-width:550px){.head{display:block;padding:15px}.hint{display:block;margin-top:8px}.detail{padding:15px}.facts{grid-template-columns:1fr}.canvas{padding:5px 8px 12px}.legend{padding:8px 15px}.detail-top{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<section class="shell" aria-label="交互流程图"><header class="head"><div><h2 id="title"></h2><p id="description"></p></div><span class="hint">点击节点 / 连线查看详情 · 画布可滚动</span></header>
<div class="canvas" tabindex="0" aria-label="流程画布，可横向滚动"><svg id="graph" role="group" aria-label="节点与连接"></svg></div>
<div class="legend"><span><b>●</b> 能力 / 阶段</span><span>→ 关系方向</span><span>┄ 待适配 / 已停用</span><span>Tab 切换 · Enter / 空格查看</span></div>
<section class="detail" aria-live="polite" aria-atomic="true"><div class="detail-top"><h3 id="detail-title">先了解这张图</h3><span class="badge" id="status">功能概览</span></div><p id="copy"></p><dl id="facts" class="facts"></dl></section></section>
<script>
const NS='http://www.w3.org/2000/svg';let data=null, selection=null;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function resize(){send('streamlit:setFrameHeight',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)})}
function short(text,max){let used=0,out='';for(const c of String(text)){used+=c.charCodeAt(0)>255?2:1;if(used>max)return out+'…';out+=c}return out}
function svg(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==undefined)e.textContent=text;return e}
function detail(item,kind){document.getElementById('detail-title').textContent=item.label;document.getElementById('status').textContent=item.status||(kind==='edge'?'衔接说明':'功能介绍');document.getElementById('copy').textContent=item.description||'暂无介绍';const facts=document.getElementById('facts');facts.replaceChildren();for(const [name,value] of item.facts||[]){let row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=String(value);row.append(dt,dd);facts.append(row)}resize()}
function choose(item,kind,notify=true){selection={id:item.id,kind};document.querySelectorAll('[data-kind]').forEach(e=>e.classList.toggle('selected',e.dataset.kind===kind&&e.dataset.id===item.id));detail(item,kind);if(notify)send('streamlit:setComponentValue',{value:selection,dataType:'json'})}
function activate(el,item,kind){el.addEventListener('click',()=>choose(item,kind));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(item,kind)}})}
function render(args){const focused=document.activeElement?.dataset;data=args;document.getElementById('title').textContent=args.title;document.getElementById('description').textContent=args.description||'';let root=document.getElementById('graph');root.replaceChildren();const nodes=args.nodes||[],edges=args.edges||[];
if(!nodes.length){document.getElementById('copy').textContent='暂无节点记录。';resize();return}
let columns=Math.max(...nodes.map(n=>n.column||0))+1,rows=Math.max(...nodes.map(n=>n.row||0))+1;
const width=Math.max(680,columns*240),height=rows*122+28;root.setAttribute('viewBox',`0 0 ${width} ${height}`);root.style.minWidth=Math.min(width,720)+'px';root.style.maxHeight='none';
const defs=svg('defs'),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#83a9b9'}));defs.append(marker);root.append(defs);
const position=n=>({x:24+(n.column||0)*240,y:18+(n.row||0)*122});const byId=new Map(nodes.map(n=>[n.id,n]));
for(const edge of edges){let a=position(byId.get(edge.source)),b=position(byId.get(edge.target));let x1=a.x+174,y1=a.y+34,x2=b.x,y2=b.y+34,d;
if(b.x>a.x){let mid=(x1+x2)/2;d=`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`}
else{ x1=a.x+87;y1=a.y+68;x2=b.x+87;y2=b.y;let mid=(y1+y2)/2;d=`M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`}
let g=svg('g',{class:'edge'+(edge.pending?' pending':''),tabindex:0,role:'button','aria-label':'连线：'+edge.label,'data-kind':'edge','data-id':edge.id});g.append(svg('path',{d,class:'hit'}),svg('path',{d,class:'wire','marker-end':'url(#arrow)'}));if(b.x>a.x&&y1===y2)g.append(svg('text',{x:(x1+x2)/2,y:y1-10,'text-anchor':'middle',class:'edge-label'},edge.short_label||'查看'));activate(g,edge,'edge');root.append(g)}
for(const n of nodes){let {x,y}=position(n);let g=svg('g',{class:'node'+(n.disabled?' disabled':''),transform:`translate(${x},${y})`,tabindex:0,role:'button','aria-label':'节点：'+n.label+'，'+(n.status||''),'data-kind':'node','data-id':n.id});g.append(svg('rect',{width:174,height:68,rx:13}),svg('circle',{cx:16,cy:22,r:3.5,class:'dot'}),svg('text',{x:29,y:27,class:'label'},short(n.label,18)),svg('text',{x:15,y:50,class:'sub'},short(n.subtitle||n.status||'点击了解',28)));activate(g,n,'node');root.append(g)}
let item;if(selection)item=(selection.kind==='node'?nodes:edges).find(n=>n.id===selection.id);
if(item)choose(item,selection.kind,false);else if(args.selected&&(item=nodes.find(n=>n.id===args.selected)))choose(item,'node',false);else{selection=null;document.getElementById('detail-title').textContent='先了解这张图';document.getElementById('status').textContent='功能概览';document.getElementById('copy').textContent=args.description||'点击节点查看用途，点击连接线了解数据如何衔接。选择只展开介绍，不会执行任务。';document.getElementById('facts').replaceChildren()};if(focused?.id){const target=[...root.querySelectorAll('[data-kind]')].find(e=>e.dataset.id===focused.id&&e.dataset.kind===focused.kind);target?.focus({preventScroll:true})}resize()}
window.addEventListener('message',e=>{if(e.source===window.parent&&e.data.type==='streamlit:render')render(e.data.args)});new ResizeObserver(resize).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
