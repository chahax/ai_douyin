<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Douyin Studio · 全页面旧新源码对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#edf0f4;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{padding:32px 40px;border-bottom:1px solid #30343a}h1{font-size:28px;margin:4px 0}h2{font-size:22px}h3{font-size:16px}small,.muted{color:#acb1bc}.tag{color:#bcf56b;letter-spacing:2px}main{display:grid;grid-template-columns:250px 1fr;max-width:1800px;margin:auto}aside{padding:22px 15px;position:sticky;top:0;max-height:100vh;overflow:auto}button{cursor:pointer;border:1px solid #353a44;border-radius:8px;background:#20232a;color:inherit;padding:9px 12px;font:inherit}aside button{display:block;width:100%;text-align:left;margin:5px 0}button.active{background:#293b22;color:#bcf56b;border-color:#789f4a}article{min-width:0;padding:25px 32px 70px;border-left:1px solid #30343a}.panel{border:1px solid #30343a;border-radius:14px;background:#191c21;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid>div{min-width:0}.badge{display:inline-block;padding:3px 9px;background:#273523;color:#bcf56b;border-radius:6px;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111318;padding:16px;border-radius:8px;font:12px/1.7 Consolas,monospace;max-height:650px;overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:10px;text-align:left;border-bottom:1px solid #30343a;vertical-align:top}a{color:#bcf56b}summary{cursor:pointer;padding:10px 0}ul{padding-left:22px}.add{color:#9ee8ad}.del{color:#ffada9}.swatch{display:inline-block;width:18px;height:18px;border:1px solid #777;vertical-align:middle;margin-right:8px;border-radius:4px}.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}input{width:100%;background:#191c21;border:1px solid #353a44;border-radius:8px;padding:10px;color:white}.light{background:#f6f6fa;color:#181921}.light pre{background:#fff;color:#181921}.light h3{color:#655cf6}@media(max-width:900px){main{grid-template-columns:1fr}aside{position:static;max-height:240px}.grid{grid-template-columns:1fr}article{padding:20px}header{padding:24px}}
</style>
<header><div class="tag">DOUYIN STUDIO / SOURCE COMPARISON</div><h1>全部页面 · 旧版与新版对比</h1><div id="meta" class="muted"></div><p>无需登录的离线对比文件 · 基于真实源码，不是截图复原</p></header><main><aside><input id="search" placeholder="筛选页面名称"><div id="nav"></div></aside><article id="content"></article></main>
<script id="dataset" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('dataset').textContent),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected='overview-all',mode='both';
$('#meta').textContent=`旧版 ${D.legacy_commit.slice(0,7)} · 新版工作树 · 采集 ${D.generated_at} · ${D.pages.length} 页 / ${D.modules.length} 个源码模块`;
const list=a=>a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">无静态条目；动态内容及辅助函数请查看源码。</p>';
const diff=d=>'<pre>'+d.text.split('\n').map(l=>'<span class="'+(l.startsWith('+')?'add':l.startsWith('-')?'del':'')+'">'+esc(l)+'</span>').join('\n')+'</pre>';
function nav(){let q=$('#search').value;$('#nav').innerHTML=[['overview-all','总览与主题参数'],...D.pages.filter(p=>p.title.includes(q)).map(p=>[p.id,p.title]),['modules-all','全部模块源码差异']].map(([id,t])=>`<button data-id="${id}" class="${selected===id?'active':''}">${esc(t)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;mode='both';render();nav();window.scrollTo(0,0);});}
function source(s,version){return `<div class="panel ${version==='old'?'light':''}"><h3>${version==='old'?'旧版 · 2c0d8d5':'新版 · 当前工作树'}</h3>`+(s?`<p>${esc(s.path)}:${s.line}–${s.end_line}<br><small>${esc(s.function)} · SHA256 ${s.sha256.slice(0,16)}…</small></p><h3>静态界面文案</h3>${list(s.labels)}<details><summary>UI 调用点与函数内依赖</summary><pre>${esc(JSON.stringify(s.calls,null,2))}</pre>${list(s.imports)}</details><details><summary>完整页面入口函数</summary><pre>${esc(s.source)}</pre></details>`:'<p>旧版不存在此页面；不虚构旧版对应画面。</p>')+'</div>';}
function render(){let out='';if(selected==='overview-all'){
out=`<div class="panel"><h2>结论与证据边界</h2><p>覆盖全部 <b>20 个入口/导航页面</b>。新增创作工作台、视频制作；其余页面既比较入口函数，也提供公共及辅助模块差异。</p><p>旧版为浅色内容区＋紫色强调色；新版为深石墨＋青柠色，默认入口由 AI 助手转为创作工作台，导航按创作、运营、资源与管理分组。</p><p>${esc(D.limitations)}</p><p>旧版 ${D.baseline_verified.length} 个页面/主题文件已与 Git 原文核对一致。当前版本包含未提交改动；每个入口函数及模块保存内容指纹。</p></div><div class="grid"><div class="panel light"><h3>旧版风格解读</h3><p>明亮后台工具界面，白色卡片、柔和阴影、紫色主按钮；深色侧栏与内容区形成强分区。</p><p>内容最大宽度 1380px，主区 padding 2rem 2.5rem 4.5rem；标题 1.85rem；胶囊标签页。</p></div><div class="panel"><h3>新版风格解读</h3><p>深色创作工作室，青柠主操作、低阴影边框卡片；首页增加内容生产入口和最近制作。</p><p>内容最大宽度 1480px，主区 padding 2.2rem 3rem 4rem；标题 28px；下划线标签页。</p></div></div><div class="panel"><h2>可复用主题参数</h2><p class="muted">以下样式示意卡是报告排版，不是业务页面截图。</p><table><tr><th>Token</th><th>旧版</th><th>新版</th></tr>${D.theme.map(t=>'<tr><td>'+esc(t.name)+'</td>'+['old','new'].map(v=>'<td>'+(/^#[0-9a-f]+$/i.test(t[v])?`<i class="swatch" style="background:${t[v]}"></i>`:'')+esc(t[v])+'</td>').join('')+'</tr>').join('')}</table></div><div class="panel"><h2>全页面覆盖清单</h2><table><tr><th>页面</th><th>新版权限</th><th>源码变化</th><th>文本增/删行</th></tr>${D.pages.map(p=>`<tr><td>${esc(p.title)}</td><td>${p.role}</td><td>${p.status}</td><td>+${p.diff.added} / −${p.diff.removed}</td></tr>`).join('')}</table></div><div class="panel"><h2>后续页面风格对比方法</h2><p>固定相同视口、浏览器缩放、权限角色与数据状态。分别对比：导航信息层级、字体与间距、配色与对比度、卡片与表格密度、交互状态。功能增减单独记录，不与纯视觉改动混算。</p><p>源码能证明样式参数和界面逻辑；不能证明实际布局无溢出、接口正常或刷新保持登录。本报告不运行生产任务、不改登录状态。</p></div>`;
}else if(selected==='modules-all'){out='<h2>全部界面模块与辅助函数差异</h2><p>包含全局导航、公共主题、认证及页面辅助函数。文本差异不是功能质量评分。</p>'+D.modules.map(m=>`<details class="panel"><summary>${esc(m.path)} · ${m.status} · +${m.diff.added} / −${m.diff.removed}</summary><p>旧 SHA256：${m.old_sha256||'无'}<br>新 SHA256：${m.new_sha256||'无'}</p>${diff(m.diff)}</details>`).join('');
}else{let p=D.pages.find(p=>p.id===selected);out=`<h2>${esc(p.title)}</h2><p><span class="badge">${p.status}</span>${p.group} · 最低角色 ${p.role}</p><p class="muted">路由：${esc(p.old_route??'旧版无此页面')} → ${esc(p.new_route)}。公共主题变化同样适用；界面文案差异包含新增、删除或改写，不等于功能的独立增删。</p><div class="tools">${[['both','旧新并排'],['old','只看旧版'],['new','只看新版']].map(([v,t])=>`<button data-mode="${v}" class="${mode===v?'active':''}">${t}</button>`).join('')}</div><div class="${mode==='both'?'grid':''}">${mode!=='new'?source(p.old,'old'):''}${mode!=='old'?source(p.new,'new'):''}</div><div class="grid"><div class="panel"><h3>新增 / 改写后的静态文案</h3>${list(p.added_labels)}</div><div class="panel"><h3>移除 / 改写前的静态文案</h3>${list(p.removed_labels)}</div></div><details class="panel"><summary>完整入口函数差异 · +${p.diff.added} / −${p.diff.removed}</summary>${diff(p.diff)}</details><p class="muted">若入口仅负责调用辅助函数，请在「全部模块源码差异」查看 ${esc(p.new.path)} 及相关模块。源码中的调用不代表已执行成功。</p>`;}
$('#content').innerHTML=out;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});}
$('#search').oninput=nav;nav();render();
</script></html>
