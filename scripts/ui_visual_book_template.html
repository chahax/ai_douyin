<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 页 · 旧新视觉对比册</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ebee;color:#20242b;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{background:#fff;padding:14px 24px;border-bottom:1px solid #d5d9df;position:sticky;top:0;z-index:2}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:20px;margin:0}button,select,a.download{font:inherit;padding:8px 12px;border:1px solid #ccd1d8;border-radius:7px;background:#fff;color:#242932;cursor:pointer;text-decoration:none}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #5889e7;outline-offset:2px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.note{color:#6c5c31;background:#fff7df;padding:8px 12px;margin-top:12px;font-size:12px;border-radius:6px}nav{display:flex;gap:7px;padding:12px 24px;overflow:auto}nav button{white-space:nowrap;font-size:12px}nav button[aria-current=true]{background:#242932;color:#fff;border-color:#242932}.caption{padding:0 24px 10px;display:flex;justify-content:space-between;gap:16px}.caption strong{font-size:17px}.caption span{color:#737b88}.spread{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 24px 24px}.panel{margin:0;min-width:0;background:#fff;border:1px solid #d0d5dc;border-radius:10px;overflow:hidden}.label{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #d0d5dc;font-weight:650}.label small{font-size:11px;color:#717986;font-weight:400}.frame{overflow:auto;max-height:calc(100vh - 245px)}img{width:100%;height:auto;display:block;cursor:zoom-in}.zoom img{width:1120px;max-width:none}.zoom .frame{overflow:auto}dialog{border:0;border-radius:12px;max-width:96vw;width:1200px;padding:12px;max-height:95vh}dialog::backdrop{background:#000b}dialog .close{position:sticky;top:0;float:right}dialog img{cursor:default}dialog p{margin:4px 0 10px;color:#68717f}@media(max-width:800px){header{padding:12px}.spread{padding:0 10px 20px;gap:8px}.caption{padding:0 12px 8px}.label{display:block;font-size:12px}.label small{display:block}.frame{max-height:none}nav{padding:10px}.controls{gap:5px}select{max-width:180px}}@media print{header,nav,.caption,dialog{display:none}.spread{display:grid;padding:0}.frame{max-height:none}.panel{break-inside:avoid}}
</style></head><body><header><div class="top"><h1>旧新视觉对比册</h1><div class="controls"><button id="prev" aria-label="上一页">← 上一页</button><label for="picker">页面</label><select id="picker"></select><button id="next" aria-label="下一页">下一页 →</button><button id="zoom" aria-pressed="false">原尺寸查看</button></div></div><div class="note">20 组 · 左旧右新 · 根据源码生成的主题与控件结构示意，非真实截图／像素级还原。动态数据省略，部分条件分支合并展示。</div></header><nav id="nav" aria-label="全部页面"></nav><div class="caption" aria-live="polite"><strong id="title"></strong><span id="status"></span></div><section class="spread" id="spread"><figure class="panel"><div class="label">A · 旧版 <small>2c0d8d5 · 2026-09-01</small></div><div class="frame"><img id="old" alt="旧版页面结构示意"></div></figure><figure class="panel"><div class="label">B · 新版 <small>当前代码 · 2026-09-06</small></div><div class="frame"><img id="new" alt="新版页面结构示意"></div></figure></section><dialog id="detail"><button class="close" id="close">关闭 ×</button><p id="detailtitle"></p><img id="large" alt="放大的页面结构示意"></dialog><script id="data" type="application/json">__DATA__</script><script>
const pages=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let index=0,zoom=false;pages.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${String(i+1).padStart(2,'0')} · ${p.title}`;$('picker').append(o);const b=document.createElement('button');b.textContent=p.title;b.onclick=()=>show(i);$('nav').append(b)});
function show(i){index=Math.max(0,Math.min(pages.length-1,i));const p=pages[index];$('picker').value=index;$('title').textContent=`${String(index+1).padStart(2,'0')} / ${pages.length}　${p.title}`;$('status').textContent=p.status;$('old').src=p.old;$('new').src=p.new;$('old').alt=p.title+' · 旧版结构示意';$('new').alt=p.title+' · 新版结构示意';$('prev').disabled=index===0;$('next').disabled=index===pages.length-1;Array.from($('nav').children).forEach((b,j)=>b.setAttribute('aria-current',j===index?'true':'false'));document.querySelectorAll('.frame').forEach(f=>{f.scrollTop=0;f.scrollLeft=0})}
$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('picker').onchange=e=>show(Number(e.target.value));$('zoom').onclick=()=>{zoom=!zoom;$('spread').classList.toggle('zoom',zoom);$('zoom').setAttribute('aria-pressed',String(zoom));$('zoom').textContent=zoom?'适应双栏':'原尺寸查看'};for(const v of ['old','new']){$(v).onclick=()=>{$('large').src=pages[index][v];$('detailtitle').textContent=pages[index].title+' · '+(v==='old'?'旧版':'新版')+' · 结构示意（非实拍）';$('detail').showModal()}}$('close').onclick=()=>$('detail').close();document.addEventListener('keydown',e=>{if($('detail').open||['SELECT','INPUT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});let syncing=false;const frames=document.querySelectorAll('.frame');frames.forEach((f,i)=>f.addEventListener('scroll',()=>{if(syncing)return;syncing=true;frames[1-i].scrollTop=f.scrollTop;requestAnimationFrame(()=>syncing=false)}));show(0);
</script></body></html>
